services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kanleaf}
      POSTGRES_USER: ${POSTGRES_USER:-kanleaf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/self-host/.env}
    volumes:
      - type: bind
        source: ${KANLEAF_DATA_DIR:-/srv/kanleaf}/postgres
        target: /var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  kanleaf:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    environment:
      BACKEND_ADDRESS: 0.0.0.0:3000
      DATABASE_URL: postgres://${POSTGRES_USER:-kanleaf}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/self-host/.env}@postgres:5432/${POSTGRES_DB:-kanleaf}
      KANLEAF_DATA_DIR: /data
    ports:
      - "${KANLEAF_BIND_ADDRESS:-127.0.0.1}:${KANLEAF_PORT:-3000}:3000"
    volumes:
      - type: bind
        source: ${KANLEAF_DATA_DIR:-/srv/kanleaf}/vaults
        target: /data/vaults
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
